name: documentation

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write   # needed for gh-pages deployment

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -U -e .'[doc]'

      - name: Sphinx build
        timeout-minutes: 15
        run: |
          python deapi/simulated_server/initialize_server.py 13240 &
          sleep 5 &&
          sphinx-build doc _build &&
          kill %1

      # Deploy to GitHub Pages for main branch
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _build/
          force_orphan: true

      # Deploy PR preview (separate repo)
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _build
          preview-repo: PreviewDE/deapi-preview
          deploy-token: ${{ secrets.PREVIEW_DEPLOY_KEY }}