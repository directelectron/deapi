[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Direct Electron"}]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "protobuf>=3.20.0",
    "pillow",
    "matplotlib",
    "scipy",
    "scikit-image",
    "sympy",
    "pywin32; platform_system == 'Windows'",
]
description = "API for DE Server"
version = "5.3b6"
keywords = [
    "EELS",
    "STEM",
    "TEM",
    "hyperspy",
    "microscopy",
    "Cryo EM",
    "4D STEM",
]
name = "deapi"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["deapi*", "deapi.*"]
where = ["."]

[project.optional-dependencies]
tests = [
    "pytest-instafail",
    "pytest-mpl",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytest>=3.6",
    "setuptools_scm",
    "pytest-cov",
    "pytest-xprocess",
    "pytest-timeout",
    "hyperspy",
    "psutil",
]
service = [
    "pyqt6",
]
# Serve frames from the de-twin digital twin: `pydeserver --twin`
twin = [
    "de-twin>=0.1.1; python_version >= '3.10'",
]
doc = [
    "sphinx",
    "pydata_sphinx_theme",
    "sphinx-gallery",
    "sphinx-tabs",
]

[project.urls]
"Bug Reports" = "https://github.com/directelectron/deapi/issues"
Documentation = "https://directelectron.github.io/deapi/"
Homepage = "https://directelectron.com/"
Support = "https://github.com/directelectron/deapi/discussions"
Source = "https://github.com/directelectron/deapi"

[project.scripts]
pydeserver = "deapi.simulated_server.initialize_server:main"
de_service = "deapi.service.de_service:main"

[tool.towncrier]
package          = "deapi"
package_dir      = "."
directory        = "upcoming_changes"
filename         = "CHANGES.rst"
start_string     = ".. towncrier release notes start\n"
issue_format     = "`#{issue} <https://github.com/directelectron/deapi/pull/{issue}>`_"
title_format     = "{version} ({project_date})"
underlines       = ["=", "-", "~"]

# Behaviour changes lead the release notes: they are the entries a reader
# upgrading has to act on, and they are easy to miss filed under "Bug Fixes".
[[tool.towncrier.type]]
directory    = "api_change"
name         = "API and Behaviour Changes"
showcontent  = true

[[tool.towncrier.type]]
directory    = "new_feature"
name         = "New Features"
showcontent  = true

[[tool.towncrier.type]]
directory    = "bugfix"
name         = "Bug Fixes"
showcontent  = true

[[tool.towncrier.type]]
directory    = "deprecation"
name         = "Deprecations"
showcontent  = true

[[tool.towncrier.type]]
directory    = "removal"
name         = "Removals"
showcontent  = true

[[tool.towncrier.type]]
directory    = "doc"
name         = "Documentation"
showcontent  = true

[[tool.towncrier.type]]
directory    = "maintenance"
name         = "Maintenance"
showcontent  = true
